<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salomée & Ethan - Connexion Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <!-- Import de Supabase via CDN pour une utilisation facile en HTML -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Lato', sans-serif;
            background-color: #f3eeeb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 3rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            width: 100%;
            max-width: 350px;
            border: 1px solid #D4AF37;
        }
        h2 { color: #D4AF37; margin-bottom: 2rem; font-weight: 400; }
        input { display: block; width: 100%; margin: 15px 0; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-family: 'Lato', sans-serif; }
        input:focus { border-color: #D4AF37; outline: none; }
        button { background-color: #D4AF37; color: white; padding: 12px 20px; border: none; border-radius: 30px; cursor: pointer; width: 100%; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; transition: background 0.3s; }
        button:hover { background-color: #bfa05f; }
        .error { color: #d9534f; margin-top: 15px; font-size: 0.9rem; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Accès Administrateur</h2>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Adresse e-mail" required>
            <input type="password" id="password" placeholder="Mot de passe" required>
            <button type="submit">Se connecter</button>
            <div id="errorMsg" class="error"></div>
        </form>
    </div>

    <script>
        // INITIALISATION DE SUPABASE
        const SUPABASE_URL = 'https://cdxtqfhnechqomkpediw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_YnYkAoVGyWkGHnH-Cd-Ddg_wuvbL6Os';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            // Réinitialisation de l'état
            errorMsg.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Connexion en cours...';

            // Tentative de connexion via Supabase
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                console.error("Erreur de connexion :", error);
                errorMsg.textContent = "Identifiants incorrects ou erreur de connexion.";
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Se connecter';
            } else {
                // Succès ! Redirection vers la page admin
                window.location.href = 'admin.html';
            }
        });
    </script>
</body>
</html>
