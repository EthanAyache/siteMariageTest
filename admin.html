<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salomée & Ethan - Administration</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <!-- Import de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Lato', sans-serif;
            background-color: #f3eeeb;
            margin: 0;
            padding: 2rem;
            color: #4a4a4a;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #D4AF37;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
        h1 { color: #D4AF37; margin: 0; font-weight: 400; }
        button {
            background-color: #4a4a4a;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #333; }
    </style>
</head>
<body style="display: none;"> <!-- Le body est caché par défaut pour éviter le clignotement -->
    
    <div class="header">
        <h1>Tableau de Bord Admin</h1>
        <button id="logoutBtn">Se déconnecter</button>
    </div>

    <div class="content">
        <p>Bienvenue dans l'espace sécurisé ! C'est ici que tu pourras plus tard gérer ta liste d'invités (depuis le fichier .csv ou ta base de données).</p>
    </div>

    <script>
        // INITIALISATION DE SUPABASE (Remplace par tes clés)
        const SUPABASE_URL = 'https://ingtrfzjxbtjzisctuyo.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_bzP_bkQglIR0yTB4kZiITg_wFnq6m3h';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 1. Vérification de la sécurité (Est-on connecté ?)
        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (!session) {
                // Pas de session, retour au login
                window.location.replace('login.html');
            } else {
                // L'utilisateur est connecté, on affiche la page
                document.body.style.display = 'block';
            }
        }

        // Lancer la vérification au chargement
        checkAuth();

        // 2. Gérer la déconnexion
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.replace('login.html');
        });
    </script>
</body>
</html>
